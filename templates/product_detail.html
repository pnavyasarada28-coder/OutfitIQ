{% load static %}

<!DOCTYPE html>

<html>

<head>

    <title>Product Detail</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}?v=7"
    >

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <a href="/" style="text-decoration:none; color:inherit;">OutfitIQ</a>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search fashion...">
            <button id="searchBtn">Search</button>
        </div>
        <div class="nav-links">
            <a href="/cart/"><button>Bag</button></a>
            <a href="/orders/"><button>Orders</button></a>
            <a href="/login/"><button>Login</button></a>
        </div>
    </nav>

    <div class="product-detail-container" id="productDetailContainer">
        <!-- Populated by JS -->
    </div>

    <!-- RELATED PRODUCTS -->
    <h2 class="section-title">Related Products</h2>
    <section class="products-container" id="relatedProductsContainer">
        <!-- Populated by JS -->
    </section>

    <!-- COMPLETE YOUR LOOK -->
    <div id="completeLookContainer"></div>
    
    <!-- RECENTLY VIEWED -->
    <div id="recentlyViewedContainer"></div>

    <script src="{% static 'js/app.js' %}?v=99"></script>
    <script>
        const productId = Number("{{ product_id }}");
        let currentProduct = null;
        
        async function fetchProductDetail() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/products/${productId}/`);
                currentProduct = await response.json();
                
                const container = document.getElementById("productDetailContainer");
                container.innerHTML = `
                    <div class="product-detail-image">
                        <img src="${getImageUrl(currentProduct.image)}" alt="${currentProduct.title}">
                    </div>
                    <div class="product-detail-info">
                        <h1 class="product-detail-title">${currentProduct.title}</h1>
                        <div class="product-detail-price">₹${currentProduct.price}</div>
                        <p class="product-detail-description">${currentProduct.description || 'Premium fashion item for modern styling.'}</p>
                        <button class="add-cart-btn" onclick="addToCart(${currentProduct.id})">Add To Bag</button>
                    </div>
                `;
                
                recordRecentlyViewed(productId, currentProduct);
                fetchRecommendations();
                fetchCompleteLook();
                fetchRecentlyViewed();
            } catch (error) {
                console.error("Error fetching product detail:", error);
            }
        }

        async function fetchRecommendations() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/recommendations/similar/${productId}/`);
                const recommendations = await response.json();
                
                const relatedContainer = document.getElementById("relatedProductsContainer");
                if (!recommendations || recommendations.length === 0) {
                    relatedContainer.innerHTML = "<p style='padding-left: 40px; color: #666;'>No related products found.</p>";
                    return;
                }
                relatedContainer.innerHTML = recommendations.slice(0, 4).map(product => `
                    <div class="product-card">
                        <img src="${getImageUrl(product.image)}" alt="${product.title}">
                        <div class="product-info">
                            <a href="/product/${product.id}/" style="text-decoration:none; color:inherit;">
                                <div class="product-title">${product.title}</div>
                            </a>
                            <div class="product-price">₹${product.price}</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error fetching recommendations:", error);
            }
        }

        async function fetchCompleteLook() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/recommendations/complete-look/${productId}/`);
                const data = await response.json();
                const complementary = data.complete_the_look || [];
                
                if (!complementary || complementary.length === 0) return;

                const completeLookHtml = `
                    <h2 class="section-title">Complete Your Look</h2>
                    <p style="padding-left: 40px; color: #666; margin-bottom: 20px;">Mix and match with these curated pieces.</p>
                    <section class="products-container" style="display: flex; gap: 20px; padding-top: 0; overflow-x: auto; padding-bottom: 20px;">
                        ${complementary.map(product => `
                            <div class="product-card" style="min-width: 220px; flex: 0 0 auto;">
                                <img src="${getImageUrl(product.image)}" style="height: 240px; object-fit: cover;" alt="${product.title}">
                                <div class="product-info" style="padding: 15px;">
                                    <a href="/product/${product.id}/" style="text-decoration:none; color:inherit;">
                                        <div class="product-title" style="font-size: 16px;">${product.title}</div>
                                    </a>
                                    <div class="product-price" style="font-size: 16px;">₹${product.price}</div>
                                    <button class="add-cart-btn" style="padding: 8px; margin-top: 10px;" onclick="addToCart(${product.id})">Add To Bag</button>
                                </div>
                            </div>
                        `).join('')}
                    </section>
                `;
                
                document.getElementById("completeLookContainer").innerHTML = completeLookHtml;
            } catch (error) {
                console.error("Error fetching complete look:", error);
            }
        }

        async function recordRecentlyViewed(id, product) {
            const token = localStorage.getItem('access_token');
            if (token) {
                try {
                    await fetch(`${API_BASE_URL}/api/recently-viewed/add/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ product_id: id })
                    });
                } catch (e) {
                    console.error("Failed to record recently viewed on backend", e);
                }
            } else {
                let recent = JSON.parse(localStorage.getItem('recently_viewed')) || [];
                recent = recent.filter(p => p.id !== id); 
                recent.unshift(product); 
                if (recent.length > 8) recent.pop(); 
                localStorage.setItem('recently_viewed', JSON.stringify(recent));
            }
        }

        async function fetchRecentlyViewed() {
            const token = localStorage.getItem('access_token');
            let recentProducts = [];

            if (token) {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/recently-viewed/`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        recentProducts = data.map(item => item.product).filter(p => p.id !== productId);
                    }
                } catch (e) {
                    console.error("Error fetching recently viewed from backend", e);
                }
            } else {
                recentProducts = JSON.parse(localStorage.getItem('recently_viewed')) || [];
                recentProducts = recentProducts.filter(p => p.id !== productId);
            }

            if (recentProducts.length === 0) return;

            const recentHtml = `
                <h2 class="section-title">Recently Viewed</h2>
                <section class="products-container" style="display: flex; gap: 20px; padding-top: 0; overflow-x: auto; padding-bottom: 20px;">
                    ${recentProducts.slice(0, 5).map(product => `
                        <div class="product-card" style="min-width: 200px; flex: 0 0 auto;">
                            <img src="${getImageUrl(product.image)}" style="height: 200px; object-fit: cover;" alt="${product.title}">
                            <div class="product-info" style="padding: 15px;">
                                <a href="/product/${product.id}/" style="text-decoration:none; color:inherit;">
                                    <div class="product-title" style="font-size: 14px;">${product.title}</div>
                                </a>
                                <div class="product-price" style="font-size: 14px;">₹${product.price}</div>
                            </div>
                        </div>
                    `).join('')}
                </section>
            `;
            document.getElementById("recentlyViewedContainer").innerHTML = recentHtml;
        }

        fetchProductDetail();
    </script>
</body>
</html>
