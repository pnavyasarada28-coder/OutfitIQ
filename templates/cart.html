{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag - OutfitIQ</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">
    <style>
        .cart-container { max-width: 800px; margin: 40px auto; padding: 20px; background: white; border-radius: 16px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }
        .cart-item { display: flex; align-items: center; gap: 20px; padding: 15px 0; border-bottom: 1px solid #eee; }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .cart-item-price { color: #ff3f6c; font-weight: bold; }
        .remove-btn { color: #888; cursor: pointer; border: none; background: none; text-decoration: underline; }
        .cart-total { text-align: right; font-size: 24px; font-weight: bold; margin-top: 20px; }
        .checkout-btn { display: block; width: 100%; padding: 15px; background: #ff3f6c; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .empty-cart { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <a href="/" style="text-decoration:none; color:inherit;">OutfitIQ</a>
        </div>
        <div class="nav-links">
            <a href="/"><button>Home</button></a>
            <a href="/login/"><button>Login</button></a>
        </div>
    </nav>

    <div class="cart-container">
        <h2>Your Bag</h2>
        <div id="cartItems">
            <!-- Populated by JS -->
        </div>
        <div class="cart-total" id="cartTotal" style="display:none;">
            Total: ₹0
        </div>
        <button class="checkout-btn" id="checkoutBtn" style="display:none;" onclick="checkout()">Proceed to Checkout</button>
    </div>

    <script src="{% static 'js/app.js' %}?v=9"></script>
    <script>
        async function loadCart() {
            const token = localStorage.getItem('access_token');
            const cartItemsContainer = document.getElementById('cartItems');
            const cartTotalEl = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (!token) {
                cartItemsContainer.innerHTML = '<div class="empty-cart">Please login to view your bag.</div>';
                cartTotalEl.style.display = 'none';
                checkoutBtn.style.display = 'none';
                return;
            }

            cartItemsContainer.innerHTML = 'Loading...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/cart/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login/';
                    return;
                }

                if (!response.ok) throw new Error("Failed to load bag");

                const cartData = await response.json();
                const items = cartData.items || [];

                if (items.length === 0) {
                    cartItemsContainer.innerHTML = '<div class="empty-cart">Your bag is empty.</div>';
                    cartTotalEl.style.display = 'none';
                    checkoutBtn.style.display = 'none';
                    return;
                }

                let total = 0;
                let itemsHtml = '';

                items.forEach(item => {
                    const product = item.product;
                    total += parseFloat(product.price) * item.quantity;
                    itemsHtml += `
                        <div class="cart-item">
                            <img src="${getImageUrl(product.image)}" alt="${product.title}">
                            <div class="cart-item-info">
                                <div class="cart-item-title">${product.title}</div>
                                <div class="cart-item-price">₹${product.price} (x${item.quantity})</div>
                            </div>
                            <button class="remove-btn" onclick="removeFromCart(${product.id})">Remove</button>
                        </div>
                    `;
                });

                cartItemsContainer.innerHTML = itemsHtml;
                cartTotalEl.innerText = `Total: ₹${total.toFixed(2)}`;
                cartTotalEl.style.display = 'block';
                checkoutBtn.style.display = 'block';
            } catch (e) {
                console.error(e);
                cartItemsContainer.innerHTML = 'Error loading bag.';
            }
        }

        async function removeFromCart(productId) {
            const token = localStorage.getItem('access_token');
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/cart/?product_id=${productId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    loadCart();
                } else {
                    alert('Failed to remove item from bag.');
                }
            } catch (e) {
                console.error("Error removing item", e);
            }
        }

        function checkout() {
            alert('Checkout successful! Thanks for shopping.');
            // In a real app, send a POST request to a checkout endpoint
        }

        loadCart();
    </script>
</body>
</html>
